<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!--
            Upstream Feishin injects its Umami analytics script here. Subbox does not:
            that instance is operated by the upstream author, under upstream's website
            ID, and Subbox is a hosted service with its own users. Loading it would
            disclose every user's IP address and user agent to a third party we have no
            processor agreement with, which we cannot lawfully do and would have to
            declare in the privacy notice.

            Removing the tag is the whole fix — it cannot be gated on the
            ANALYTICS_DISABLED env var, because settings.js (which defines it) is loaded
            after this point in the document. The upstream tracker hooks in
            features/analytics/ are left in place for merge cleanliness; they all guard
            on `window.umami`, which is now never defined, so they no-op.
        -->
        <title>Sub-box</title>
        <% if (web) { %>
        <link rel="icon" href="./assets/favicon.ico" />
        <script src="settings.js"></script>
        <% } %>
    </head>

    <body style="background-color: #000">
        <div id="root">
            <script type="module" src="main.tsx"></script>
        </div>
    </body>
</html>
